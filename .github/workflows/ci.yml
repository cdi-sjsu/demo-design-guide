name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build the development image
        run: docker build --tag demo-design-guide-dev --file .devcontainer/Dockerfile .

      - name: Run quality checks in the development image
        run: >-
          docker run --rm --user root
          --volume "${{ github.workspace }}:/workspace"
          --workdir /workspace
          demo-design-guide-dev
          bash -lc 'make ci'

name: Project task
description: Propose a focused implementation, verification, documentation, or tooling task.
title: "[Task]: "
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What observable outcome should this task produce?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the checks that prove the task is complete.
      placeholder: |
        - [ ] Criterion one
        - [ ] Criterion two
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes and references
      description: Link the relevant specification section or prior discussion.
